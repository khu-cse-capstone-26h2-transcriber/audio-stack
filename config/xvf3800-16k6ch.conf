# USB 16k6ch firmware. Confirm USB capture channel 1 is the desired beam.
# The other channels are never mixed into the engine input.
[capture]
device = auto:xvf3800
native_rate = 16000
strict_rate = true
channels = 6
channel_index = 0
period_ms = 20
buffer_periods = 4

[pre]
resample_to = 16000
highpass_hz = 0
# Compare the onboard DSP alone before adding another noise suppressor.
# Override with --denoise rnnoise to run the 16 -> 48 -> 16 kHz path.
denoise = off
silence_gate_db = -45
