# ============================================================================
# audiostack default config — installed as /etc/audiostack/audiostack.conf
# Daemon search order: --config arg > ./audiostack.conf > ./config/audiostack.conf
#                      > /etc/audiostack/audiostack.conf
# ============================================================================

[capture]
# Ubuntu for Qualcomm / RUBIK Pi 3: 3.5 mm headset microphone input.
# Official example: onboard card 0, capture PCM 2; verify with arecord -l.
# Configure the mixer route first (docs/UBUNTU-INPUT.md).
# For a development host, override the device with its actual capture PCM.
device = plughw:0,2
# Prefer 48 kHz for the headset input; the stack resamples to 16 kHz.
# 0 = auto (try 16000, then 48000, then 44100). plughw may also convert rates.
native_rate = 48000
# Capture one microphone channel, then send mono to the engine.
channels = 1
channel_index = 0
# period 20 ms = 320 samples @16k
period_ms = 20
# buffer = 4 periods = 80 ms
buffer_periods = 4

[pre]
# target format: Whisper standard input (16 kHz / mono / S16_LE)
resample_to = 16000
# 50 Hz high-pass (engine pipeline note). 0 = disable
highpass_hz = 50
# off | rnnoise (requires a build with ASTK_ENABLE_RNNOISE=ON)
denoise = off
# silence gate (dBFS): sets the silence flag on AUDIO frames (VAD hint)
silence_gate_db = -45

[engine]
# UNIX domain socket — where the engine connects
socket = /run/audiostack/engine.sock
# line-command control socket for humans/scripts/Node (status, session rotate ...)
ctrl_socket = /run/audiostack/ctrl.sock
# audio kept while no engine is connected (seconds) — replayed on (re)connect
cache_seconds = 10
# delivery path: socket | shm | both
#   shm = POSIX shared-memory ring (lowest latency, 30 s ring — same idea as
#         the engine's "fixed 30-second ring buffer")
transport = socket
shm_name = /audiostack_ring
shm_seconds = 30

[backend]
# Node/Express backend. On-board or remote — only base_url changes
# (same role as the STT_SERVICE_URL env var).
enabled = true
base_url = http://127.0.0.1:3000
session_path = /api/sessions
transcript_path = /api/sessions/{session}/transcripts
end_path = /api/sessions/{session}/end
timeout_ms = 3000
retry_seconds = 3
queue_max = 512

[log]
# trace | debug | info | warn | error
level = info
