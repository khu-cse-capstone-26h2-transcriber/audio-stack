# Software audio through the real ALSA/C++ daemon; requires snd-aloop.
# feed_wav_loopback.sh overrides the card using the discovered Loopback card.
# All sections not present here use the daemon defaults.
[capture]
device = plughw:CARD=Loopback,DEV=1
native_rate = 0
channels = 1
period_ms = 20
buffer_periods = 4
