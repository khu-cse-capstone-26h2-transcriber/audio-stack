# USB 48k2ch firmware. Confirm USB capture channel 1 is the desired beam.
[capture]
device = auto:xvf3800
native_rate = 48000
strict_rate = true
channels = 2
channel_index = 0
period_ms = 20
buffer_periods = 4

[pre]
resample_to = 16000
highpass_hz = 0
# Override with --denoise rnnoise to process at native 48 kHz before downsampling.
denoise = off
silence_gate_db = -45
